name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # hər bazar ertəsi: yeni CVE-lər kod dəyişməsə də köhnə asılılıqlarda çıxır
  workflow_dispatch:
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bütün git tarixçəsi: silinmiş fayldakı secret də tapılır
      - name: gitleaks (bütün tarixçə)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: bandit (kodda təhlükəli pattern-lər; Medium və High)
        run: bandit -r app tools -ll
      - name: pip-audit (asılılıqlarda məlum CVE-lər)
        run: pip-audit -r requirements.txt --strict

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t alert2case:ci .
      - name: trivy (image-dəki OS və Python paketləri)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 \
            image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed alert2case:ci
      - name: root olmayan istifadəçi
        run: test "$(docker run --rm --entrypoint id alert2case:ci -u)" = "10001"
