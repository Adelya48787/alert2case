# Production override (6.5). docker-compose.yml-in üzərinə yazılır:
#   make up-prod
#   (= docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build api worker)
# Dev konfiqurasiyasını əvəz edir: kod mount olunmur, --reload yoxdur, fayl sistemi yalnız oxunandır.
# Compose v2.24+ lazımdır (!reset / !override).
services:
  api:
    build: { context: ., dockerfile: Dockerfile }
    image: alert2case:${APP_VERSION:-1.0.0}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # /stage/act (n8n) API prosesində case yarada bilər, ona görə api də case_files volume-una yazır
    volumes: !override
      - case_files:/app/var
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: Dockerfile }
    image: alert2case:${APP_VERSION:-1.0.0}
    command: ["python", "-m", "app.worker"]
    volumes: !override
      - case_files:/app/var
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  case_files:
