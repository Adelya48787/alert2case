[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["app"]
# I/O adapterləri real Redis/PostgreSQL ilə integration testdə (6.4) yoxlanılır
omit = ["app/worker.py", "app/db.py", "app/queue.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Alembic şablonu istifadə olunmayan "import sqlalchemy as sa" yaradır
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
