
name: alert2case

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:?}
    environment:
      POSTGRES_DB: alert2case
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env-də boşdur}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d alert2case"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [soc_net]

  redis:
    image: redis:${REDIS_VERSION:?}
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [soc_net]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?}
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      GENERIC_TIMEZONE: Asia/Baku
      TZ: Asia/Baku
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports: ["127.0.0.1:5678:5678"]
    volumes: [n8n_data:/home/node/.n8n]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [soc_net]

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:?}
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    restart: unless-stopped
    networks: [soc_net]
    environment:
      MP_SMTP_DISABLE_RDNS: "true"

  api:
    build: { context: ., dockerfile: Dockerfile.dev }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment: &app_env
      DATABASE_URL: postgresql://soc:${POSTGRES_PASSWORD}@postgres:5432/alert2case
      REDIS_URL: redis://redis:6379/0
      THEHIVE_URL: ${THEHIVE_URL:-http://thehive:9000}
      SMTP_HOST: mailpit
    volumes: [".:/code"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [soc_net]

  worker:
    build: { context: ., dockerfile: Dockerfile.dev }
    command: python -m app.worker
    env_file: .env
    environment: *app_env
    volumes: [".:/code"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [soc_net]

  cassandra:
    image: cassandra:${CASSANDRA_VERSION:?}
    profiles: ["thehive"]
    environment:
      CASSANDRA_CLUSTER_NAME: TheHive
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 256M
    volumes: [cassandra_data:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    networks: [soc_net]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:?}
    profiles: ["thehive"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes: [es_data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    networks: [soc_net]

  thehive:
    image: strangebee/thehive:${THEHIVE_VERSION:?}
    profiles: ["thehive"]
    depends_on:
      cassandra: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    environment:
      JVM_OPTS: "-Xms1024M -Xmx1024M"
    command:
      - --secret
      - ${THEHIVE_SECRET:?}
      - --cql-hostnames
      - cassandra
      - --es-hostnames
      - elasticsearch
      - --no-config-cortex
    ports: ["${THEHIVE_BIND:-127.0.0.1}:9000:9000"]
    volumes: [thehive_data:/opt/thp/thehive/files]
    restart: unless-stopped
    networks: [soc_net]

volumes:
  pg_data:
  redis_data:
  n8n_data:
  cassandra_data:
  es_data:
  thehive_data:

networks:
  soc_net:
